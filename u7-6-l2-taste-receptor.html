<title>Taste Receptor Signal</title>
<style>
  :root{--bg:#E8EDF5;--card:#FFFFFF;--text:#0D1B2A;--muted:#6B7C99;
    --accent:#3A9ED3;--step-bg:#D5DCE9;--step-active:#C18A22;--step-act-text:#FFFFFF;
    --btn-sec:#D5DCE9;--btn-sec-text:#4A5C78}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#060D1A;--card:#0D1830;--text:#DCE4F0;--muted:#7A8BA8;
    --accent:#4FACDE;--step-bg:#111F35;--step-active:#D4961E;--step-act-text:#060D1A;
    --btn-sec:#111F35;--btn-sec-text:#7A8BA8}}
  :root[data-theme="dark"]{--bg:#060D1A;--card:#0D1830;--text:#DCE4F0;--muted:#7A8BA8;
    --accent:#4FACDE;--step-bg:#111F35;--step-active:#D4961E;--step-act-text:#060D1A;
    --btn-sec:#111F35;--btn-sec-text:#7A8BA8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:.75rem 1rem 1.5rem}
  header{text-align:center;margin-bottom:1.25rem}
  h1{font-size:1.35rem;font-weight:700;letter-spacing:-.015em;margin-bottom:.3rem}
  .subtitle{font-size:.82rem;color:var(--muted)}
  .card{background:var(--card);border-radius:16px;padding:1.125rem 1.125rem 1rem;
    box-shadow:0 2px 20px rgba(0,0,0,.10);max-width:1080px;width:100%;
    display:flex;flex-direction:column;gap:.875rem}
  canvas{border-radius:10px;display:block;width:100%;height:auto;cursor:pointer}
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
  @media(max-width:500px){.steps{grid-template-columns:repeat(2,1fr)}}
  .step{padding:.45rem .5rem;border-radius:7px;font-size:.88rem;font-weight:500;
    text-align:center;background:var(--step-bg);color:var(--muted);
    transition:background .35s,color .35s;line-height:1.35;cursor:pointer;user-select:none}
  .step.active{background:var(--step-active);color:var(--step-act-text);font-weight:600}
  .step-num{display:block;font-size:.72rem;font-weight:600;opacity:.6;margin-bottom:.15rem;letter-spacing:.04em}
  .controls{display:flex;gap:.5rem;justify-content:center}
  button{background:var(--accent);color:#fff;border:none;border-radius:7px;
    padding:.45rem 1.4rem;font-size:.82rem;font-weight:600;cursor:pointer;transition:opacity .15s}
  button:hover{opacity:.82}
  button.sec{background:var(--btn-sec);color:var(--btn-sec-text)}
</style>

<header>
  <h1>Unit 7.6 · L2 &mdash; How Taste Receptor Proteins Work</h1>
  <p class="subtitle">Inside a taste bud &mdash; click to pause</p>
</header>
<div class="card">
  <canvas id="cvs"></canvas>
  <div class="steps">
    <div class="step" id="s0"><span class="step-num">STEP 1</span>Molecule enters taste pore</div>
    <div class="step" id="s1"><span class="step-num">STEP 2</span>Molecule binds receptor protein</div>
    <div class="step" id="s2"><span class="step-num">STEP 3</span>Protein changes shape &rarr; Ca&#x00B2;&#x207A; cascade</div>
    <div class="step" id="s3"><span class="step-num">STEP 4</span>Signal sent to brain</div>
  </div>
  <div class="controls">
    <button id="btn-play">Pause</button>
    <button id="btn-restart" class="sec">Restart</button>
  </div>
</div>

<script>
const cv=document.getElementById('cvs');
const ctx=cv.getContext('2d');
const W=680,H=356;
const _dpr=window.devicePixelRatio||1,_sc=Math.max(2,_dpr);
cv.width=W*_sc;cv.height=H*_sc;ctx.scale(_sc,_sc);

const cl01=x=>Math.max(0,Math.min(1,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>t*t*(3-2*t);
const eo3=t=>1-Math.pow(1-t,3);
const ph=(t,s,e)=>cl01((t-s)/(e-s));
const lRGB=(a,b,t)=>a.map((v,i)=>Math.round(lerp(v,b[i],t)));
const rgb=([r,g,b])=>`rgb(${r},${g},${b})`;
const rgba=([r,g,b],a)=>`rgba(${r},${g},${b},${a})`;

const C={
  bg:[10,14,22],bgG:[16,22,36],
  main:[88,60,40],flnk:[65,48,32],
  mem:[112,84,58],
  rec:[68,106,152],recAct:[218,158,38],
  mv:[102,76,50],nuc:[50,34,22],
  mol:[218,158,38],ca:[80,180,240],
  ep:[44,36,28],pore:[26,20,14],
  sig:[228,88,66],ax:[118,128,142],
  lbl:[175,200,228],
};

const CX=200;
const BUD_CY=183,BUD_RX=56,BUD_RY=118;
const BUD_TOP=BUD_CY-BUD_RY,BUD_BOT=BUD_CY+BUD_RY;
const PORE_Y=BUD_TOP-3,PORE_W=10;
const SURF_Y=BUD_TOP+7;
const CELL_TOP=BUD_TOP+14,CELL_BOT=BUD_BOT-12,CELL_H=CELL_BOT-CELL_TOP;
const MAIN_RX=11,FLNK1_RX=9,FLNK2_RX=8;
const FLNK2L=CX-32,FLNK1L=CX-17,FLNK1R=CX+17,FLNK2R=CX+32;
const REC_Y=CELL_TOP+8,REC_W=14,REC_H=20;
const NUC_CY=CELL_TOP+Math.round(CELL_H*0.60),NUC_RX=9,NUC_RY=12;
const AX_TOP=CELL_BOT+4,AX_BOT=AX_TOP+16,AX_W=3;
const ST_CY=AX_BOT+8,ST_R=8;
const SX=CX+ST_R+5,SY=ST_CY,SCX=420,SCY=ST_CY-18,SEX=W-62,SEY=ST_CY-28;
const TX=460,TY=10,TW=208,TH=90;

function cellRx(y,maxRx){
  const f=(y-CELL_TOP)/CELL_H;
  return maxRx*Math.pow(4*f*(1-f),0.55)*(1+0.18*Math.sin(f*Math.PI));
}
function pathCell(cx,maxRx){
  const N=60;ctx.moveTo(cx,CELL_TOP);
  for(let i=1;i<=N;i++){const y=CELL_TOP+i*CELL_H/N;ctx.lineTo(cx+cellRx(y,maxRx),y);}
  for(let i=N;i>=0;i--){const y=CELL_TOP+i*CELL_H/N;ctx.lineTo(cx-cellRx(y,maxRx),y);}
  ctx.closePath();
}

function drawTasteCell(cx,maxRx,colBody,al,cascadeWave){
  const grad=ctx.createLinearGradient(cx-maxRx,CELL_TOP,cx+maxRx,CELL_TOP);
  const dk=colBody.map(v=>Math.round(v*.5));
  const br=colBody.map(v=>Math.min(255,Math.round(v*1.35)));
  grad.addColorStop(0,rgba(dk,al*.92));grad.addColorStop(.18,rgba(br,al*.96));
  grad.addColorStop(.82,rgba(colBody,al*.96));grad.addColorStop(1,rgba(dk,al*.92));
  ctx.save();ctx.beginPath();pathCell(cx,maxRx);ctx.fillStyle=grad;ctx.fill();
  if(cascadeWave>0){
    ctx.save();ctx.beginPath();pathCell(cx,maxRx);ctx.clip();
    const waveY=CELL_TOP+cascadeWave*CELL_H;
    const actGrad=ctx.createLinearGradient(cx,CELL_TOP,cx,waveY);
    actGrad.addColorStop(0,rgba(lRGB(colBody,C.recAct,.55),.88));
    actGrad.addColorStop(1,rgba(C.recAct,.72));
    ctx.fillStyle=actGrad;
    ctx.fillRect(cx-maxRx-4,CELL_TOP,maxRx*2+8,Math.max(0,waveY-CELL_TOP+4));
    const wFront=28;
    const wg=ctx.createLinearGradient(cx,Math.max(CELL_TOP,waveY-wFront),cx,waveY+6);
    wg.addColorStop(0,rgba(C.recAct,0));wg.addColorStop(.7,rgba([255,220,90],.88));
    wg.addColorStop(1,rgba(C.recAct,.12));
    ctx.fillStyle=wg;ctx.fillRect(cx-maxRx-4,Math.max(CELL_TOP,waveY-wFront),maxRx*2+8,wFront+10);
    ctx.restore();
    for(let i=0;i<9;i++){
      const pp=cl01(cascadeWave-i*(1/9)*.8);
      if(pp<=0.01||pp>=0.96)continue;
      const py=CELL_TOP+pp*CELL_H,mr=cellRx(py,maxRx)*0.48;
      const px=cx+Math.sin(i*2.7)*mr,pa=Math.sin(pp*Math.PI)*0.85;
      ctx.beginPath();ctx.arc(px,py,2.8,0,Math.PI*2);
      ctx.fillStyle=rgba(C.ca,pa);ctx.fill();
      ctx.fillStyle=rgba([255,255,255],pa*.7);
      ctx.font='5px system-ui';ctx.fillText('2+',px+3,py-2);
    }
  }
  ctx.restore();
}

function drawEpithelium(){
  ctx.save();
  ctx.beginPath();ctx.rect(0,0,W,SURF_Y+10);ctx.fillStyle=rgba(C.ep,.88);ctx.fill();
  ctx.beginPath();ctx.ellipse(CX,BUD_CY,BUD_RX,BUD_RY,0,0,Math.PI*2);
  ctx.fillStyle=rgba([16,12,8],.93);ctx.fill();
  ctx.beginPath();ctx.rect(0,0,W,SURF_Y);ctx.fillStyle=rgba(C.ep,.9);ctx.fill();
  ctx.beginPath();ctx.ellipse(CX,SURF_Y,PORE_W/2,4,0,0,Math.PI*2);
  ctx.fillStyle=rgba(C.pore,.96);ctx.fill();
  ctx.restore();
}

function drawBudOutline(){
  ctx.save();ctx.strokeStyle=rgba(C.mem,.25);ctx.lineWidth=1.4;ctx.setLineDash([3,4]);
  ctx.beginPath();ctx.ellipse(CX,BUD_CY,BUD_RX+2,BUD_RY+2,0,0,Math.PI*2);
  ctx.stroke();ctx.setLineDash([]);ctx.restore();
}

function drawMicrovilli(recAct){
  const col=lRGB(C.mv,C.recAct,recAct*.4);
  for(let i=0;i<5;i++){
    const mx=CX-8+(i/4)*16,mh=14*(0.78+0.22*Math.cos(i*1.3));
    const vg=ctx.createLinearGradient(mx,CELL_TOP-mh,mx,CELL_TOP);
    vg.addColorStop(0,rgba(col.map(v=>Math.min(255,Math.round(v*1.2))),.86));
    vg.addColorStop(1,rgba(col,.8));
    ctx.fillStyle=vg;ctx.beginPath();ctx.roundRect(mx-1.8,CELL_TOP-mh,3.6,mh,2);ctx.fill();
  }
}

function drawReceptor(recAct,docked,wobble){
  const col=lRGB(C.rec,C.recAct,recAct);
  const dk=col.map(v=>Math.round(v*.5)),br=col.map(v=>Math.min(255,Math.round(v*1.3)));
  const memY=CELL_TOP-4,memH=9;
  const mg=ctx.createLinearGradient(CX-MAIN_RX,memY,CX+MAIN_RX,memY);
  mg.addColorStop(0,rgba(C.mem.map(v=>Math.round(v*.6)),.9));
  mg.addColorStop(.5,rgba(C.mem,.95));mg.addColorStop(1,rgba(C.mem.map(v=>Math.round(v*.6)),.9));
  ctx.fillStyle=mg;ctx.fillRect(CX-MAIN_RX-2,memY,MAIN_RX*2+4,memH);
  const spreadW=wobble*3;
  [[-1,0],[0,0],[1,0]].forEach(([h],idx)=>{
    const hx=CX+h*(4+spreadW);
    const hg=ctx.createLinearGradient(hx-3,REC_Y,hx+3,REC_Y);
    hg.addColorStop(0,rgba(dk,.9));hg.addColorStop(.5,rgba(col,.97));hg.addColorStop(1,rgba(dk,.9));
    ctx.fillStyle=hg;ctx.beginPath();ctx.roundRect(hx-3,REC_Y+wobble*(idx===1?0:2),6,REC_H,3);ctx.fill();
    ctx.beginPath();ctx.ellipse(hx,REC_Y+wobble*(idx===1?0:2)+2,3,2.5,0,0,Math.PI*2);
    ctx.fillStyle=rgba(br,.9);ctx.fill();
  });
  ctx.beginPath();ctx.ellipse(CX,REC_Y+1+(docked?5:3),5,docked?4:5,0,0,Math.PI*2);
  ctx.fillStyle=rgba(dk,.85);ctx.fill();
  const hg=ctx.createRadialGradient(CX-REC_W*.2,REC_Y+2,0,CX-REC_W*.2,REC_Y+2,REC_W*.36);
  hg.addColorStop(0,rgba([255,255,255],.22+recAct*.15));hg.addColorStop(1,rgba([255,255,255],0));
  ctx.fillStyle=hg;ctx.beginPath();ctx.ellipse(CX,REC_Y+2,REC_W/2,5,0,0,Math.PI*2);ctx.fill();
  if(recAct>.08){
    ctx.save();ctx.globalAlpha=recAct*.45;
    const gg=ctx.createRadialGradient(CX,REC_Y+REC_H/2,0,CX,REC_Y+REC_H/2,REC_W+16);
    gg.addColorStop(0,rgba(C.recAct,.55));gg.addColorStop(1,rgba(C.recAct,0));
    ctx.fillStyle=gg;ctx.beginPath();ctx.ellipse(CX,REC_Y+REC_H/2,REC_W+16,REC_H/2+10,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

function drawNucleus(){
  const ng=ctx.createRadialGradient(CX-3,NUC_CY-3,0,CX,NUC_CY,NUC_RX);
  ng.addColorStop(0,rgba(C.nuc.map(v=>Math.min(255,Math.round(v*1.6))),.92));
  ng.addColorStop(1,rgba(C.nuc,.92));
  ctx.beginPath();ctx.ellipse(CX,NUC_CY,NUC_RX,NUC_RY,-0.18,0,Math.PI*2);
  ctx.fillStyle=ng;ctx.fill();
  ctx.beginPath();ctx.arc(CX-2,NUC_CY-2,3.5,0,Math.PI*2);
  ctx.fillStyle=rgba(C.nuc.map(v=>Math.round(v*.55)),.88);ctx.fill();
}

function drawBrain(alpha){
  const cx=644,cy=289;
  ctx.save();ctx.globalAlpha=alpha;
  ctx.beginPath();
  ctx.moveTo(cx-30,cy+2);
  ctx.bezierCurveTo(cx-32,cy-16,cx-20,cy-28,cx-8,cy-27);
  ctx.bezierCurveTo(cx-3,cy-26,cx-1,cy-20,cx+1,cy-16);
  ctx.bezierCurveTo(cx+3,cy-20,cx+8,cy-28,cx+20,cy-26);
  ctx.bezierCurveTo(cx+32,cy-22,cx+32,cy-6,cx+30,cy+4);
  ctx.bezierCurveTo(cx+30,cy+16,cx+20,cy+27,cx+8,cy+28);
  ctx.bezierCurveTo(cx+3,cy+29,cx-3,cy+29,cx-8,cy+28);
  ctx.bezierCurveTo(cx-20,cy+26,cx-32,cy+16,cx-30,cy+2);
  ctx.closePath();
  const gr=ctx.createRadialGradient(cx-8,cy-8,0,cx,cy,34);
  gr.addColorStop(0,rgba([232,208,218],1));gr.addColorStop(.65,rgba([212,182,196],.97));
  gr.addColorStop(1,rgba([176,148,162],.93));
  ctx.fillStyle=gr;ctx.fill();
  ctx.strokeStyle=rgba([158,126,142],.82);ctx.lineWidth=1.3;ctx.stroke();
  ctx.strokeStyle=rgba([148,116,134],.48);ctx.lineWidth=.85;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx+1,cy-16);ctx.quadraticCurveTo(cx+3,cy,cx+1,cy+18);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-18,cy-14);ctx.quadraticCurveTo(cx-22,cy-4,cx-18,cy+8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-10,cy+10);ctx.quadraticCurveTo(cx-16,cy+18,cx-10,cy+24);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+18,cy-12);ctx.quadraticCurveTo(cx+22,cy,cx+18,cy+10);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+8,cy+13);ctx.quadraticCurveTo(cx+15,cy+20,cx+8,cy+25);ctx.stroke();
  ctx.font='bold 8px system-ui';ctx.fillStyle=rgba([98,68,84],.90);
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('BRAIN',cx,cy+2);
  ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.restore();
}

function drawAxon(synAct){
  ctx.fillStyle=rgba(C.ax,.82);ctx.fillRect(CX-AX_W,AX_TOP,AX_W*2,AX_BOT-AX_TOP);
  const sa=synAct||0;
  const synCol=lRGB(C.bg,C.sig,sa);
  const sg=ctx.createRadialGradient(CX-ST_R*.3,ST_CY-ST_R*.3,0,CX,ST_CY,ST_R);
  sg.addColorStop(0,rgba(synCol.map(v=>Math.min(255,Math.round(v*1.35))),.45+sa*.50));
  sg.addColorStop(.6,rgba(synCol,.35+sa*.55));
  sg.addColorStop(1,rgba(synCol.map(v=>Math.round(v*.6)),.30+sa*.55));
  ctx.beginPath();ctx.arc(CX,ST_CY,ST_R,0,Math.PI*2);ctx.fillStyle=sg;ctx.fill();
  if(sa>.15){
    ctx.save();ctx.globalAlpha=sa*.40;
    const syg=ctx.createRadialGradient(CX,ST_CY,0,CX,ST_CY,ST_R+12);
    syg.addColorStop(0,rgba(C.sig,.6));syg.addColorStop(1,rgba(C.sig,0));
    ctx.fillStyle=syg;ctx.beginPath();ctx.arc(CX,ST_CY,ST_R+12,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  if(sa>.02&&sa<.92){
    const pulseY=lerp(AX_TOP,AX_BOT,sa);
    ctx.save();
    const pg=ctx.createRadialGradient(CX,pulseY,0,CX,pulseY,10);
    pg.addColorStop(0,rgba(C.sig,.72));pg.addColorStop(1,rgba(C.sig,0));
    ctx.fillStyle=pg;ctx.beginPath();ctx.arc(CX,pulseY,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=rgba([255,255,255],.85);ctx.beginPath();ctx.arc(CX,pulseY,3,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

function drawMolecule(t){
  const descend=eo3(ph(t,.08,.30));
  const bind=ph(t,.30,.42);
  if(bind>=1)return;
  const targetY=REC_Y+2,startY=PORE_Y-20;
  const mx=lerp(CX+4,CX,descend),my=lerp(startY,targetY,descend);
  const al=1-bind;
  ctx.globalAlpha=al;
  for(let i=4;i>=1;i--){
    const s=cl01(descend-i*.055);
    const tx=lerp(CX+4,CX,eo3(s)),ty=lerp(startY,targetY,eo3(s));
    const tg=ctx.createRadialGradient(tx,ty,0,tx,ty,lerp(8,2.5,i/4));
    tg.addColorStop(0,rgba(C.mol,(1-i/5)*.24));tg.addColorStop(1,rgba(C.mol,0));
    ctx.fillStyle=tg;ctx.beginPath();ctx.arc(tx,ty,lerp(8,2.5,i/4),0,Math.PI*2);ctx.fill();
  }
  const r=5.5;
  ctx.fillStyle=rgba(C.mol,.92);ctx.beginPath();
  for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/6;i===0?ctx.moveTo(mx+r*Math.cos(a),my+r*Math.sin(a)):ctx.lineTo(mx+r*Math.cos(a),my+r*Math.sin(a));}
  ctx.closePath();ctx.fill();
  const hg=ctx.createRadialGradient(mx,my,0,mx,my,15);
  hg.addColorStop(0,rgba(C.mol,.4));hg.addColorStop(1,rgba(C.mol,0));
  ctx.fillStyle=hg;ctx.beginPath();ctx.arc(mx,my,15,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
  const la=al*cl01(1-ph(t,.18,.34));
  if(la>.06){
    ctx.globalAlpha=la;
    ctx.strokeStyle=rgba(C.mol,.55);ctx.lineWidth=.8;
    ctx.beginPath();ctx.moveTo(mx+r,my);ctx.lineTo(mx+22,my);ctx.stroke();
    ctx.font='bold 9px system-ui';ctx.fillStyle=rgba(C.mol,.92);
    ctx.fillText('BITTER MOLECULE',mx+24,my+3);
    ctx.globalAlpha=1;
  }
  if(bind>0){
    const r2=bind*42;
    const bg=ctx.createRadialGradient(CX,targetY,0,CX,targetY,r2);
    bg.addColorStop(0,rgba(C.mol,.36*(1-bind)));bg.addColorStop(1,rgba(C.mol,0));
    ctx.fillStyle=bg;ctx.beginPath();ctx.arc(CX,targetY,r2,0,Math.PI*2);ctx.fill();
  }
}

function drawTongueInset(t){
  const appear=sm(ph(t,.02,.14));
  ctx.globalAlpha=(.26+appear*.67);
  ctx.save();ctx.beginPath();ctx.roundRect(TX,TY,TW,TH,6);
  ctx.fillStyle=rgba([12,8,6],.75);ctx.fill();
  ctx.strokeStyle=rgba([120,90,60],.4);ctx.lineWidth=1;ctx.stroke();ctx.restore();
  ctx.save();ctx.beginPath();ctx.roundRect(TX+1,TY+1,TW-2,TH-2,5);ctx.clip();
  const tongTop=TY+20;
  ctx.beginPath();ctx.roundRect(TX+4,tongTop,TW-8,TH-tongTop+TY-4,3);
  ctx.fillStyle=rgba([128,52,62],.65);ctx.fill();
  ctx.beginPath();ctx.rect(TX+4,tongTop,TW-8,15);
  ctx.fillStyle=rgba([155,78,88],.72);ctx.fill();
  for(let i=0;i<7;i++){
    const bx=TX+10+(i*(TW-20)/6);
    ctx.beginPath();ctx.ellipse(bx,tongTop,7,8,0,0,Math.PI,true);
    ctx.fillStyle=rgba([170,88,98],.68);ctx.fill();
  }
  const buds=[TX+TW*.26,TX+TW*.48,TX+TW*.70];
  const actGlow=sm(ph(t,.34,.54));
  buds.forEach((bx,idx)=>{
    const isC=idx===1;
    const bc=isC?lRGB([78,52,36],C.recAct,actGlow*.7):[68,48,32];
    ctx.beginPath();ctx.ellipse(bx,tongTop+8,8,12,0,0,Math.PI*2);
    ctx.fillStyle=rgba(bc,isC?.72+actGlow*.2:.42);ctx.fill();
    ctx.strokeStyle=rgba(isC?C.recAct:[100,72,52],isC?.26+actGlow*.42:.18);
    ctx.lineWidth=1;ctx.stroke();
    ctx.beginPath();ctx.arc(bx,tongTop+1,2.5,0,Math.PI*2);
    ctx.fillStyle=rgba([18,12,8],.88);ctx.fill();
  });
  const zx=buds[1],zy=tongTop+8;
  ctx.beginPath();ctx.arc(zx,zy,14,0,Math.PI*2);
  ctx.strokeStyle=rgba(C.recAct,.20+actGlow*.46);ctx.lineWidth=1;
  ctx.setLineDash([2.5,2.5]);ctx.stroke();ctx.setLineDash([]);
  ctx.restore();
  ctx.font='7.5px system-ui';ctx.fillStyle=rgba(C.lbl,.38);
  ctx.fillText('TONGUE (cross-section)',TX+5,TY+10);
  ctx.globalAlpha=1;
  const connA=(.10+actGlow*.22);
  ctx.save();ctx.strokeStyle=rgba(C.recAct,connA);ctx.lineWidth=.9;ctx.setLineDash([3,5]);
  ctx.beginPath();ctx.moveTo(zx-13,zy);
  ctx.bezierCurveTo(zx-60,zy+42,CX+38,PORE_Y+8,CX,PORE_Y+12);ctx.stroke();
  ctx.setLineDash([]);ctx.restore();
}

function leader_(tx,ty,lx,ly,label,right,al){
  if((al||0)<=0.01)return;
  ctx.save();ctx.globalAlpha=al;
  ctx.strokeStyle=rgba(C.lbl,.45);ctx.lineWidth=.85;
  ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(lx,ly);ctx.stroke();
  ctx.font='9px system-ui';ctx.fillStyle=rgba(C.lbl,.72);
  ctx.textAlign=right?'right':'left';
  ctx.fillText(label,lx+(right?-4:4),ly+3);
  ctx.textAlign='left';ctx.restore();
}

function drawLabels(t,recAct,cascadeWave){
  const MAX=0.82,DIM=0.16;
  const g1=sm(ph(t,.06,.16))*(t<.32?MAX:DIM);
  const g2=sm(ph(t,.28,.38))*(t<.52?MAX:DIM);
  const g3=sm(ph(t,.48,.58))*(t<.72?MAX:DIM);
  const g4=sm(ph(t,.68,.78))*MAX;

  leader_(CX-PORE_W/2+2,PORE_Y+5,  CX-40,10,  'TASTE PORE',true,g1);
  leader_(CX-7,CELL_TOP-11,          CX-40,24,  'MICROVILLI',true,g1);
  leader_(CX+MAIN_RX+1,CELL_TOP-1,  CX+MAIN_RX+30,CELL_TOP-14,'APICAL MEMBRANE',false,g2);
  leader_(CX+MAIN_RX+1,REC_Y+REC_H/2,CX+MAIN_RX+30,REC_Y+REC_H/2+8,'RECEPTOR PROTEIN',false,g2);

  const cellLabelY=CELL_TOP+CELL_H*.30;
  leader_(CX+cellRx(cellLabelY,MAIN_RX)+1,cellLabelY,CX+MAIN_RX+30,cellLabelY,'TASTE RECEPTOR CELL',false,g3);
  leader_(CX+NUC_RX+1,NUC_CY,CX+MAIN_RX+30,NUC_CY,'NUCLEUS',false,g3*.55);

  if(cascadeWave>.12){
    const clAl=cl01((cascadeWave-.12)/.18);
    const fixY=CELL_TOP+Math.round(CELL_H*0.42);
    leader_(CX-Math.round(cellRx(fixY,MAIN_RX))-1,fixY,CX-42,fixY+4,'Ca²⁺ wave',true,clAl*.75);
    if(clAl>.15){
      ctx.save();ctx.globalAlpha=clAl*.48;
      ctx.font='7.5px system-ui';ctx.fillStyle=rgba(C.ca,.75);
      ctx.textAlign='right';ctx.fillText('intracellular signal',CX-45,fixY+14);
      ctx.textAlign='left';ctx.restore();
    }
  }

  const axMid=(AX_TOP+AX_BOT)/2;
  leader_(CX+AX_W+1,axMid,  CX+MAIN_RX+30,axMid,  'NERVE FIBER',false,g4);
  leader_(CX+ST_R+1,ST_CY,  CX+MAIN_RX+30,ST_CY+8,'SYNAPSE',false,g4);

  if(recAct>.25){
    const fa=cl01((recAct-.25)/.28)*(1-sm(ph(t,.60,.70)));
    if(fa>.02){
      ctx.save();ctx.globalAlpha=fa;
      ctx.font='bold 8.5px system-ui';ctx.fillStyle=rgb(C.recAct);
      ctx.strokeStyle=rgba(C.recAct,.5);ctx.lineWidth=.9;
      const ry=REC_Y+REC_H*.4;
      ctx.beginPath();ctx.moveTo(CX+REC_W/2+2,ry);ctx.lineTo(CX+MAIN_RX+30,ry-14);ctx.stroke();
      ctx.fillText('activated!',CX+MAIN_RX+32,ry-11);
      ctx.restore();
    }
  }
}

function bPt(t,x0,y0,x1,y1,x2,y2){const u=1-t;return[u*u*x0+2*u*t*x1+t*t*x2,u*u*y0+2*u*t*y1+t*t*y2];}
function bTan(t,x0,y0,x1,y1,x2,y2){return[2*(1-t)*(x1-x0)+2*t*(x2-x1),2*(1-t)*(y1-y0)+2*t*(y2-y1)];}
const N_SH=14,sheaths=[];
for(let i=0;i<N_SH;i++){
  const tc=(i+.5)/N_SH;
  const[px,py]=bPt(tc,SX,SY,SCX,SCY,SEX,SEY);
  const[dx,dy]=bTan(tc,SX,SY,SCX,SCY,SEX,SEY);
  sheaths.push({px,py,angle:Math.atan2(dy,dx)});
}
const SEG_W=W/(N_SH*1.65);

function drawSignal(t){
  const p=eo3(ph(t,.74,.93));
  if(p<=0)return;
  for(let i=0;i<N_SH;i++){
    const{px,py,angle}=sheaths[i];
    const segT=(i+.5)/N_SH;
    const isAct=segT<=p,isPulse=Math.abs(segT-p)<.06;
    const al=isAct?.52:.10,shW=SEG_W*.72,shH=9;
    ctx.save();ctx.translate(px,py);ctx.rotate(angle);
    const shG=ctx.createLinearGradient(0,-shH,0,shH);
    const shC=isAct?C.recAct:C.ax;
    shG.addColorStop(0,rgba(shC.map(v=>Math.round(v*.6)),al));
    shG.addColorStop(.5,rgba(shC,al+.14));
    shG.addColorStop(1,rgba(shC.map(v=>Math.round(v*.6)),al));
    ctx.beginPath();ctx.roundRect(-shW/2,-shH/2,shW,shH,shH/2);
    ctx.fillStyle=shG;ctx.fill();
    if(isPulse){
      ctx.globalAlpha=(1-Math.abs(segT-p)/.06)*.7;
      ctx.beginPath();ctx.roundRect(-shW/2,-shH/2,shW,shH,shH/2);
      ctx.fillStyle=rgba([255,255,255],.44);ctx.fill();ctx.globalAlpha=1;
    }
    ctx.restore();
  }
  const[hx,hy]=bPt(p,SX,SY,SCX,SCY,SEX,SEY);
  const hg=ctx.createRadialGradient(hx,hy,0,hx,hy,16);
  hg.addColorStop(0,rgba(C.sig,.88));hg.addColorStop(1,rgba(C.sig,0));
  ctx.fillStyle=hg;ctx.beginPath();ctx.arc(hx,hy,16,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=rgb(C.sig);ctx.beginPath();ctx.arc(hx,hy,5,0,Math.PI*2);ctx.fill();
  ctx.font='8.5px system-ui';ctx.fillStyle=rgba(C.lbl,.28);ctx.fillText('GUSTATORY NERVE',412,278);
  if(p>.04){ctx.font='bold 8.5px system-ui';ctx.fillStyle=rgba(C.sig,.78);ctx.fillText('NERVE SIGNAL SENT',282,278);}
  const brainAlpha=p>.87?sm(cl01((p-.87)/.13)):(p>.05?.22:0);
  if(brainAlpha>.01)drawBrain(brainAlpha);
}

function drawBg(){
  const g=ctx.createRadialGradient(CX,H*.45,0,CX,H*.45,H*.88);
  g.addColorStop(0,rgb(C.bgG));g.addColorStop(1,rgb(C.bg));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

function activeStep(t){
  if(t<.09)return -1;
  if(t<.32)return 0;
  if(t<.52)return 1;
  if(t<.72)return 2;
  if(t<.95)return 3;
  return -1;
}

function draw(t){
  drawBg();
  const recAct=sm(ph(t,.34,.52));
  const cascadeWave=sm(ph(t,.52,.72));
  const synAct=sm(ph(t,.70,.77));
  const wobble=Math.sin(ph(t,.34,.50)*Math.PI*1.5)*sm(ph(t,.34,.40))*(1-sm(ph(t,.48,.54)));
  const docked=ph(t,.30,.42)>=1;

  drawBudOutline();
  ctx.save();ctx.globalAlpha=.42;
  drawTasteCell(FLNK2L,FLNK2_RX,C.flnk,1,0);drawTasteCell(FLNK2R,FLNK2_RX,C.flnk,1,0);
  ctx.restore();
  ctx.save();ctx.globalAlpha=.58;
  drawTasteCell(FLNK1L,FLNK1_RX,C.flnk,1,0);drawTasteCell(FLNK1R,FLNK1_RX,C.flnk,1,0);
  ctx.restore();

  drawTasteCell(CX,MAIN_RX,C.main,1,cascadeWave);
  drawNucleus();
  drawAxon(synAct);
  drawEpithelium();
  drawMicrovilli(recAct);
  drawMolecule(t);
  drawReceptor(recAct,docked,wobble);
  drawLabels(t,recAct,cascadeWave);
  drawSignal(t);
  drawTongueInset(t);

  ['s0','s1','s2','s3'].forEach((id,i)=>
    document.getElementById(id).classList.toggle('active',i===activeStep(t)));
}

let t=0,running=true,lastTs=null;
const CYCLE=13000;
function loop(ts){
  if(!running)return;
  if(lastTs!==null)t=(t+(ts-lastTs)/CYCLE)%1;
  lastTs=ts;draw(t);requestAnimationFrame(loop);
}
const btnPlay=document.getElementById('btn-play');
document.getElementById('btn-restart').addEventListener('click',()=>{
  t=0;lastTs=null;if(!running){running=true;btnPlay.textContent='Pause';requestAnimationFrame(loop);}
});
function togglePlay(){running=!running;btnPlay.textContent=running?'Pause':'Play';if(running){lastTs=null;requestAnimationFrame(loop);}}
btnPlay.addEventListener('click',togglePlay);
document.getElementById('cvs').addEventListener('click',togglePlay);
const STEP_T=[0.20,0.40,0.63,0.80];
['s0','s1','s2','s3'].forEach((id,i)=>{
  document.getElementById(id).addEventListener('click',e=>{
    e.stopPropagation();t=STEP_T[i];lastTs=null;
    if(running){running=false;btnPlay.textContent='Play';}draw(t);
  });
});
running=false;btnPlay.textContent='Play';draw(0);
</script>
