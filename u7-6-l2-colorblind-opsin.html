<title>Colorblind Opsin</title>
<style>
  :root{
    --bg:#E8EDF5;--card:#FFFFFF;--text:#0D1B2A;--muted:#6B7C99;
    --accent:#3A9ED3;--btn-sec:#D5DCE9;--btn-sec-text:#4A5C78;
  }
  @media(prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#060D1A;--card:#0D1830;--text:#DCE4F0;--muted:#7A8BA8;
      --accent:#4FACDE;--btn-sec:#111F35;--btn-sec-text:#7A8BA8;
    }
  }
  :root[data-theme="dark"]{
    --bg:#060D1A;--card:#0D1830;--text:#DCE4F0;--muted:#7A8BA8;
    --accent:#4FACDE;--btn-sec:#111F35;--btn-sec-text:#7A8BA8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:.75rem 1rem 1.5rem}
  header{text-align:center;margin-bottom:1.25rem}
  h1{font-size:1.35rem;font-weight:700;letter-spacing:-.015em;margin-bottom:.3rem}
  .subtitle{font-size:.82rem;color:var(--muted)}
  .card{background:var(--card);border-radius:16px;padding:1.125rem 1.125rem 1rem;
    box-shadow:0 2px 20px rgba(0,0,0,.10),0 1px 4px rgba(0,0,0,.06);
    max-width:1080px;width:100%;display:flex;flex-direction:column;gap:.875rem}
  canvas{border-radius:10px;display:block;width:100%;height:auto;cursor:pointer}
  .controls{display:flex;gap:.5rem;justify-content:center}
  button{background:var(--accent);color:#fff;border:none;border-radius:7px;
    padding:.45rem 1.4rem;font-size:.82rem;font-weight:600;cursor:pointer;transition:opacity .15s}
  button:hover{opacity:.82}
  button.sec{background:var(--btn-sec);color:var(--btn-sec-text)}
</style>

<header>
  <h1>Color Vision &amp; Colorblindness</h1>
  <p class="subtitle">Colorblindness &mdash; the opsin protein mechanism</p>
</header>
<div class="card">
  <canvas id="cvs"></canvas>
  <p style="font-size:.72rem;color:var(--muted);text-align:center;margin-top:-.2rem">Arc = activation strength &nbsp;·&nbsp; nm = peak sensitivity &nbsp;·&nbsp; Bent line = retinal (straightens when light is absorbed) &nbsp;·&nbsp; Brain box = perceived color</p>
  <div class="controls">
    <button id="btnLoop" class="sec">⏸ Pause</button>
    <button id="btnRestart" class="sec">⟳ Restart</button>
  </div>
</div>

<script>
// ── Canvas ────────────────────────────────────────────────────
const W=680,H=390;
const _sc=Math.max(2,window.devicePixelRatio||1);
const cv=document.getElementById('cvs');
const ctx=cv.getContext('2d');
cv.width=W*_sc; cv.height=H*_sc;
ctx.scale(_sc,_sc);

// ── Layout ────────────────────────────────────────────────────
const CY_TOP=120;          // Becky row center y
const CY_BOT=270;          // Joe row center y
const DIVIDER_Y=(CY_TOP+CY_BOT)/2; // 161.5

// Three opsins per row in a triangle: M top-center, S bottom-left, L bottom-right
const PROT_MID_X=W/2;
const PROT_H=55,PROT_V=20; // horizontal and vertical offsets from row center
const PROT_POS=[
  [PROT_MID_X-PROT_H, +PROT_V], // S-cone (blue) — bottom left
  [PROT_MID_X,        -PROT_V], // M-cone (green) — top center
  [PROT_MID_X+PROT_H, +PROT_V], // L-cone (red) — bottom right
];
const PROT_DISC_R=22;

// Wave enters from left, arrives at protein zone
const WAVE_X0=10;
const WAVE_X1=PROT_POS[0][0]-PROT_DISC_R-5; // 258

// Signal travels right from protein zone to brain box
const SIG_X0=PROT_POS[2][0]+PROT_DISC_R+5;  // 422
const SIG_X1=470;
const BOX_CX=562, BOX_HW=88, BOX_HH=27;

// Slider
const SL_X=36,SL_Y=9,SL_W=608,SL_H=11;
const LABEL_Y=SL_Y+SL_H+2;   // 22 — preset chip row

// Pills
const PILL_CY=373,PILL_H=22,PILL_W=92;

// TM helix ring — gap faces RIGHT (0°) so signal exits toward brain box
const TM_DEG=[180,235,290,315,30,85,140];
const TM_SHIFT=[3,4];

// ── Data ──────────────────────────────────────────────────────
const PRESETS=[400,450,530,580,620,660];
const NM_NAMES={400:'Violet',450:'Blue',530:'Green',580:'Yellow',620:'Orange',660:'Red'};
const CB_TYPES=[
  {id:'deut',label:'Deuteranopia',common:'red-green (green-weak)'},
  {id:'prot',label:'Protanopia',  common:'red-green (red-weak)'},
  {id:'trit',label:'Tritanopia',  common:'blue-yellow'},
];

const OPSINS_NORM=[
  {peak:420,sigma:25,label:'blue opsin', col:[80,60,220]},
  {peak:530,sigma:55,label:'green opsin',col:[35,185,55]},
  {peak:560,sigma:60,label:'red opsin',  col:[210,55,40]},
];
const OPSINS_ALT={
  deut:[
    {peak:420,sigma:25,label:'blue opsin', col:[80,60,220]},
    {peak:560,sigma:60,label:'altered (M)',col:[175,85,30]},
    {peak:560,sigma:60,label:'red opsin',  col:[210,55,40]},
  ],
  prot:[
    {peak:420,sigma:25,label:'blue opsin', col:[80,60,220]},
    {peak:530,sigma:55,label:'green opsin',col:[35,185,55]},
    {peak:530,sigma:55,label:'altered (L)',col:[130,155,25]},
  ],
  trit:[
    {peak:490,sigma:40,label:'altered (S)',col:[28,135,185]},
    {peak:530,sigma:55,label:'green opsin',col:[35,185,55]},
    {peak:560,sigma:60,label:'red opsin',  col:[210,55,40]},
  ],
};

const DT_DEUT=[{nm:400,c:[100,40,200]},{nm:450,c:[10,52,248]},{nm:530,c:[133,122,0]},{nm:580,c:[210,192,0]},{nm:620,c:[162,128,0]},{nm:660,c:[130,119,0]}];
const DT_PROT=[{nm:400,c:[88,42,192]},{nm:450,c:[18,72,228]},{nm:530,c:[55,172,32]},{nm:580,c:[195,188,8]},{nm:620,c:[98,82,4]},{nm:660,c:[40,32,0]}];
const DT_TRIT=[{nm:400,c:[70,18,22]},{nm:450,c:[8,55,60]},{nm:530,c:[12,185,185]},{nm:580,c:[235,200,200]},{nm:620,c:[215,100,90]},{nm:660,c:[210,52,14]}];

// ── State ─────────────────────────────────────────────────────
let selectedNm=530,cbType='deut',t=0,lastTs=null,loopOn=true,waveT=0;
const PLAY_LABEL='▶ Play',PAUSE_LABEL='⏸ Pause';

// ── Helpers ───────────────────────────────────────────────────
const cl01=x=>Math.max(0,Math.min(1,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ph=(v,a,b)=>cl01((v-a)/(b-a));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const gaussian=(nm,peak,sigma)=>Math.exp(-((nm-peak)**2)/(2*sigma*sigma));

function spectralRGB(nm){
  let r=0,g=0,b=0;
  if(nm>=380&&nm<440){r=(440-nm)/60;b=1;}
  else if(nm<490){g=(nm-440)/50;b=1;}
  else if(nm<510){g=1;b=(510-nm)/20;}
  else if(nm<580){r=(nm-510)/70;g=1;}
  else if(nm<645){r=1;g=(645-nm)/65;}
  else if(nm<=700){r=1;}
  const f=nm>=380&&nm<420?.3+.7*(nm-380)/40:1;
  return[Math.round(Math.pow(r*f,.8)*255),Math.round(Math.pow(g*f,.8)*255),Math.round(Math.pow(b*f,.8)*255)];
}

function perceivedColor(nm,type){
  const dt={deut:DT_DEUT,prot:DT_PROT,trit:DT_TRIT}[type];
  for(let i=0;i<dt.length-1;i++){
    if(nm>=dt[i].nm&&nm<=dt[i+1].nm){
      const f=(nm-dt[i].nm)/(dt[i+1].nm-dt[i].nm);
      return dt[i].c.map((v,j)=>Math.round(v+(dt[i+1].c[j]-v)*f));
    }
  }
  return nm<=dt[0].nm?[...dt[0].c]:[...dt[dt.length-1].c];
}

function rr(x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect){ctx.roundRect(x,y,w,h,[r]);}
  else{ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}
}

function hexPath(x,y,r){
  ctx.beginPath();
  for(let i=0;i<6;i++){const a=(i*60-30)*Math.PI/180;i===0?ctx.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r):ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}
  ctx.closePath();
}

// ── Sine wave (left → right) ──────────────────────────────────
function drawSineWave(cy,nm,animT){
  const wP=ease(ph(animT,0,.30));       // head travel 0→1
  const wF=ease(ph(animT,.28,.46));     // fade to dim 0→1
  const alpha=lerp(1,.18,wF);          // fades to dim, stays visible throughout
  if(alpha<.01) return;

  const[r,g,b]=spectralRGB(nm);
  const lam=(nm-400)/300;              // 0=violet, 1=red
  const freq=lerp(.20,.028,lam);       // wide range: violet tight/rapid, red slow/long
  const amp=13;                         // bigger amplitude so frequency differences pop
  const headX=lerp(WAVE_X0,WAVE_X1,wP);
  const phase=waveT*5.3;

  ctx.save();
  ctx.strokeStyle=`rgba(${r},${g},${b},${alpha})`;ctx.lineWidth=2.2;
  ctx.shadowColor=`rgba(${r},${g},${b},${alpha*.6})`;ctx.shadowBlur=6;
  ctx.beginPath();let first=true;
  for(let xx=WAVE_X0;xx<=headX;xx+=1.5){
    const yy=cy+Math.sin(xx*freq*Math.PI*2+phase)*amp;
    if(first){ctx.moveTo(xx,yy);first=false;}else ctx.lineTo(xx,yy);
  }
  ctx.stroke();
  // Leading dot only while wave is still travelling in
  if(wP>.04&&wP<.98&&alpha>.3){
    const hy=cy+Math.sin(headX*freq*Math.PI*2+phase)*amp;
    ctx.shadowBlur=10;ctx.fillStyle=`rgba(${r},${g},${b},${alpha})`;
    ctx.beginPath();ctx.arc(headX,hy,3,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

// ── Opsin protein (at cx, cy) ─────────────────────────────────
function drawProtein(cy,cx,nm,opsin,act,perceivedCol,animT){
  const oc=opsin.col;
  const[wr,wg,wb]=spectralRGB(nm);
  const pocketR=PROT_DISC_R*.55; // inner pocket radius

  ctx.save();

  // Outer membrane disc
  ctx.beginPath();ctx.arc(cx,cy,PROT_DISC_R,0,Math.PI*2);
  ctx.fillStyle='rgba(20,40,80,.12)';ctx.fill();
  ctx.strokeStyle='rgba(80,110,160,.25)';ctx.lineWidth=1;ctx.stroke();

  // Absorption glow — incoming light floods the pocket
  const absorbRise=ease(ph(animT,.22,.42));
  const absorbFall=ease(ph(animT,.42,.60));
  const absorbAlpha=absorbRise*(1-absorbFall)*act;
  if(absorbAlpha>.02){
    const aGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,PROT_DISC_R);
    aGrad.addColorStop(0,`rgba(${wr},${wg},${wb},${absorbAlpha*.85})`);
    aGrad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();ctx.arc(cx,cy,PROT_DISC_R,0,Math.PI*2);
    ctx.fillStyle=aGrad;ctx.fill();
  }

  // Opsin pocket — colored by amino acid environment (sets spectral peak)
  const pGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,pocketR*1.6);
  pGrad.addColorStop(0,`rgba(${oc[0]},${oc[1]},${oc[2]},.32)`);
  pGrad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath();ctx.arc(cx,cy,pocketR*1.6,0,Math.PI*2);
  ctx.fillStyle=pGrad;ctx.fill();

  // Retinal chromophore: bent (11-cis) → straight (all-trans) on absorption
  const bend=(1-act)*pocketR*1.2,len=pocketR*.8;
  const retG=Math.round(lerp(140,200,act));
  const blendAmt=act*absorbAlpha*1.5;
  const retR2=Math.round(lerp(255,wr,cl01(blendAmt)));
  const retB2=Math.round(lerp(18,wb,cl01(blendAmt)));
  ctx.strokeStyle=`rgba(${retR2},${retG},${retB2},${.78+act*.2})`;
  ctx.lineWidth=2.5;ctx.shadowColor=`rgba(${retR2},${retG},${retB2},.5)`;ctx.shadowBlur=4;
  ctx.beginPath();ctx.moveTo(cx-len,cy+bend*.4);ctx.quadraticCurveTo(cx,cy-bend,cx+len,cy+bend*.4);ctx.stroke();
  ctx.shadowBlur=0;

  // Pocket flash with perceived color when signal fires
  const sigFlash=ease(ph(animT,.68,.75))*(1-ease(ph(animT,.75,.84)))*act;
  if(sigFlash>.02){
    const[pcr,pcg,pcb]=perceivedCol;
    const fg=ctx.createRadialGradient(cx,cy,0,cx,cy,PROT_DISC_R);
    fg.addColorStop(0,`rgba(${pcr},${pcg},${pcb},${sigFlash*.75})`);
    fg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();ctx.arc(cx,cy,PROT_DISC_R,0,Math.PI*2);
    ctx.fillStyle=fg;ctx.fill();
  }

  // Activation meter arc — sweeps clockwise from top proportional to act
  const meterR=PROT_DISC_R+5;
  ctx.beginPath();ctx.arc(cx,cy,meterR,0,Math.PI*2);
  ctx.strokeStyle='rgba(80,100,140,.18)';ctx.lineWidth=2;ctx.stroke();
  if(act>.01){
    ctx.beginPath();ctx.arc(cx,cy,meterR,-Math.PI/2,-Math.PI/2+act*Math.PI*2);
    ctx.strokeStyle=`rgba(${wr},${wg},${wb},.85)`;ctx.lineWidth=2;ctx.stroke();
  }

  // Peak nm above arc, color name below disc
  const shortName=opsin.label.split(' ')[0];
  ctx.fillStyle='rgba(220,230,245,.95)';ctx.font='6px system-ui';ctx.textAlign='center';
  ctx.fillText(shortName.toUpperCase()+' ('+opsin.peak+'nm)',cx,cy+meterR+9);
  ctx.fillText('OPSIN',cx,cy+meterR+17);

  ctx.restore();
}

// ── Signal pulse (right-traveling) — style matches cone-cell-opsin ──
function drawSignalPulse(cy,color,act,animT){
  const p=ph(animT,.70,.84);
  if(p<=0||p>=1) return;
  const x=lerp(SIG_X0,SIG_X1,ease(p));
  const[r,g,b]=color;
  const s=Math.max(.18,act);
  ctx.save();
  // Comet tail — three faded glows trailing the head
  [18,12,6].forEach((off,i)=>{
    const tx=Math.max(SIG_X0,x-off);
    const a=(i+1)/5*.55*s;
    const tg=ctx.createRadialGradient(tx,cy,0,tx,cy,9+off*.35);
    tg.addColorStop(0,`rgba(${r},${g},${b},${a})`);
    tg.addColorStop(1,`rgba(${r},${g},${b},0)`);
    ctx.fillStyle=tg;ctx.beginPath();ctx.arc(tx,cy,9+off*.35,0,Math.PI*2);ctx.fill();
  });
  // Head
  const pg=ctx.createRadialGradient(x,cy,0,x,cy,11);
  pg.addColorStop(0,`rgba(${r},${g},${b},${.70*s})`);
  pg.addColorStop(1,`rgba(${r},${g},${b},0)`);
  ctx.fillStyle=pg;ctx.beginPath();ctx.arc(x,cy,11,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=`rgba(${r},${g},${b},${.88*s})`;
  ctx.beginPath();ctx.arc(x,cy,3.5,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ── Brain box ─────────────────────────────────────────────────
function drawBrainBox(cy,rowLabel,color,alpha){
  const x=BOX_CX-BOX_HW,y=cy-BOX_HH,w=BOX_HW*2,h=BOX_HH*2;
  ctx.save();
  ctx.fillStyle='rgba(15,28,55,.72)';ctx.strokeStyle='rgba(70,95,145,.4)';ctx.lineWidth=1;
  rr(x,y,w,h,5);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(200,215,235,.90)';ctx.font='7px system-ui';ctx.textAlign='left';
  ctx.fillText(rowLabel,x+5,y+10);
  const sw=w*.5,sh=h*.56,sy2=cy-sh/2+3;
  const[r,g,b]=color;
  ctx.fillStyle=`rgba(${r},${g},${b},${alpha})`;
  rr(BOX_CX-sw/2,sy2,sw,sh,3);ctx.fill();
  if(alpha>.12){ctx.strokeStyle=`rgba(255,255,255,${alpha*.18})`;ctx.lineWidth=.8;rr(BOX_CX-sw/2,sy2,sw,sh,3);ctx.stroke();}
  ctx.restore();
}

// ── Spectral slider + preset chips ───────────────────────────
function drawSlider(nm){
  const x=SL_X,y=SL_Y,w=SL_W,h=SL_H;
  const grad=ctx.createLinearGradient(x,0,x+w,0);
  [[380,'rgba(50,0,70,1)'],[440,'rgba(80,0,210,1)'],[490,'rgba(0,60,255,1)'],
   [510,'rgba(0,190,0,1)'],[580,'rgba(255,225,0,1)'],[620,'rgba(255,80,0,1)'],[700,'rgba(175,0,0,1)']
  ].forEach(([snm,c])=>grad.addColorStop((snm-380)/320,c));
  ctx.fillStyle=grad;rr(x,y,w,h,h/2);ctx.fill();

  PRESETS.forEach(p=>{
    const px=x+w*(p-380)/320;
    const active=p===nm;
    const[r,g,b]=spectralRGB(p);
    ctx.fillStyle=active?'rgba(255,255,255,.95)':'rgba(255,255,255,.38)';
    ctx.fillRect(px-.5,y,1,h);
    const lw=36,lh=14,lx=px-lw/2,ly=LABEL_Y+1;
    rr(lx,ly,lw,lh,7);
    ctx.fillStyle=active?`rgba(${r},${g},${b},.92)`:'rgba(40,55,90,.5)';ctx.fill();
    ctx.font=(active?'bold ':'')+'8px system-ui';ctx.fillStyle=active?'#fff':'rgba(185,200,225,.85)';
    ctx.textAlign='center';ctx.fillText(NM_NAMES[p],px,ly+lh*.72);
  });

  // Axis ticks above bar — skip any tick the selector sits on
  ctx.fillStyle='rgba(180,195,220,.88)';ctx.font='6px system-ui';ctx.textAlign='center';
  [400,500,600,700].forEach(tnm=>{
    if(Math.abs(tnm-nm)<=15)return;
    const tx=x+w*(tnm-380)/320;
    ctx.fillText(tnm+'nm',tx,y-2);
  });

  const selX=x+w*(nm-380)/320;
  ctx.fillStyle='#fff';ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(selX,y+h/2,h*.45,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(190,205,230,.95)';ctx.font='bold 7px system-ui';ctx.textAlign='center';
  ctx.fillText(nm+'nm',selX,y-2);
}

// ── Layout chrome ─────────────────────────────────────────────
function drawLayout(){
  ctx.save();
  // Row divider
  ctx.strokeStyle='rgba(90,115,160,.2)';ctx.lineWidth=1;ctx.setLineDash([5,5]);
  ctx.beginPath();ctx.moveTo(8,DIVIDER_Y);ctx.lineTo(W-8,DIVIDER_Y);ctx.stroke();
  ctx.setLineDash([]);
  // Row labels (above each row, left-aligned)
  ctx.font='bold 8px system-ui';ctx.textAlign='left';
  ctx.fillStyle='rgba(60,195,115,.92)';
  ctx.fillText('Normal Vision',10,CY_TOP-35);
  const cbLabel=CB_TYPES.find(c=>c.id===cbType).label;
  ctx.fillStyle='rgba(205,125,55,.92)';
  ctx.fillText(cbLabel,10,CY_BOT-35);
  // Signal path guides
  [CY_TOP,CY_BOT].forEach(cy=>{
    ctx.strokeStyle='rgba(80,215,195,.1)';ctx.lineWidth=1;ctx.setLineDash([2,4]);
    ctx.beginPath();ctx.moveTo(SIG_X0+4,cy);ctx.lineTo(SIG_X1,cy);ctx.stroke();
    ctx.setLineDash([]);
  });
  ctx.restore();
}

// ── Type pills ────────────────────────────────────────────────
function drawPills(){
  const n=CB_TYPES.length,gap=8,totalW=n*PILL_W+(n-1)*gap;
  const sx=(W-totalW)/2;
  CB_TYPES.forEach((p,i)=>{
    const px=sx+i*(PILL_W+gap);
    const active=p.id===cbType;
    ctx.save();
    rr(px,PILL_CY-PILL_H/2,PILL_W,PILL_H,PILL_H/2);
    ctx.fillStyle=active?'rgba(79,172,222,.92)':'rgba(55,80,125,.38)';ctx.fill();
    if(active){ctx.strokeStyle='rgba(79,172,222,.55)';ctx.lineWidth=1;rr(px,PILL_CY-PILL_H/2,PILL_W,PILL_H,PILL_H/2);ctx.stroke();}
    ctx.font=(active?'bold ':'')+'7.5px system-ui';
    ctx.fillStyle=active?'#fff':'rgba(140,165,205,.8)';ctx.textAlign='center';
    ctx.fillText(p.label,px+PILL_W/2,PILL_CY-2);
    ctx.font='7px system-ui';
    ctx.fillStyle=active?'rgba(255,255,255,.72)':'rgba(120,148,190,.65)';
    ctx.fillText(p.common,px+PILL_W/2,PILL_CY+7);
    ctx.restore();
  });
}

// ── Main draw ─────────────────────────────────────────────────
function draw(){
  ctx.clearRect(0,0,W,H);
  const isDark=document.documentElement.dataset.theme==='dark'||
    (!document.documentElement.dataset.theme&&window.matchMedia('(prefers-color-scheme:dark)').matches);
  ctx.fillStyle=isDark?'#0D1830':'#FFFFFF';ctx.fillRect(0,0,W,H);

  const aT=t;
  const altOpsins=OPSINS_ALT[cbType];
  const normActs=OPSINS_NORM.map(o=>gaussian(selectedNm,o.peak,o.sigma));
  const altActs=altOpsins.map(o=>gaussian(selectedNm,o.peak,o.sigma));
  const actGate=ease(ph(aT,.25,.56));
  const maxNormAct=Math.max(...normActs);
  const maxAltAct=Math.max(...altActs);

  drawLayout();
  drawSlider(selectedNm);

  const normPerceived=spectralRGB(selectedNm);
  const altPerceived=perceivedColor(selectedNm,cbType);

  // Row 1 — Becky
  drawSineWave(CY_TOP,selectedNm,aT);
  OPSINS_NORM.forEach((o,i)=>drawProtein(CY_TOP+PROT_POS[i][1],PROT_POS[i][0],selectedNm,o,normActs[i]*actGate,normPerceived,aT));
  if(maxNormAct>.01) drawSignalPulse(CY_TOP,normPerceived,maxNormAct,aT);
  drawBrainBox(CY_TOP,'brain sees:',normPerceived,ease(ph(aT,.85,1.0)));

  // Row 2 — Joe
  drawSineWave(CY_BOT,selectedNm,aT);
  altOpsins.forEach((o,i)=>drawProtein(CY_BOT+PROT_POS[i][1],PROT_POS[i][0],selectedNm,o,altActs[i]*actGate,altPerceived,aT));
  if(maxAltAct>.01) drawSignalPulse(CY_BOT,altPerceived,maxAltAct,aT);
  drawBrainBox(CY_BOT,'brain sees:',altPerceived,ease(ph(aT,.85,1.0)));

  drawPills();
}

// ── Animation loop ────────────────────────────────────────────
const CYCLE=7.5;
function tick(ts){
  if(!lastTs) lastTs=ts;
  const dt=(ts-lastTs)/1000;
  if(loopOn&&t<1) t=Math.min(1,t+dt/CYCLE);
  waveT+=dt;
  lastTs=ts;draw();
  requestAnimationFrame(tick);
}

function togglePlay(){
  if(t>=1){t=0;lastTs=null;loopOn=true;btnLoop.textContent=PAUSE_LABEL;}
  else{loopOn=!loopOn;btnLoop.textContent=loopOn?PAUSE_LABEL:PLAY_LABEL;}
}
function restart(){t=0;lastTs=null;loopOn=true;btnLoop.textContent=PAUSE_LABEL;}
requestAnimationFrame(tick);

// ── Controls ──────────────────────────────────────────────────
const btnLoop=document.getElementById('btnLoop');
btnLoop.addEventListener('click',togglePlay);
document.getElementById('btnRestart').addEventListener('click',restart);

// ── Canvas click ──────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(['Space','ArrowRight','Period'].includes(e.code)){e.preventDefault();togglePlay();}
  if(['ArrowLeft','Comma'].includes(e.code)){e.preventDefault();restart();}
});

cv.addEventListener('click',e=>{
  const rect=cv.getBoundingClientRect();
  const cx=(e.clientX-rect.left)/rect.width*W;
  const cy=(e.clientY-rect.top)/rect.height*H;
  const chipBottom=LABEL_Y+1+14+4;
  if(cy>=SL_Y-5&&cy<=chipBottom&&cx>=SL_X&&cx<=SL_X+SL_W){
    const raw=380+(cx-SL_X)/SL_W*320;
    const snapped=PRESETS.reduce((a,b)=>Math.abs(b-raw)<Math.abs(a-raw)?b:a);
    if(snapped!==selectedNm){selectedNm=snapped;restart();}
    return;
  }
  const n=CB_TYPES.length,gap=8,totalW=n*PILL_W+(n-1)*gap,sx=(W-totalW)/2;
  let hit=false;
  CB_TYPES.forEach((p,i)=>{
    const px=sx+i*(PILL_W+gap);
    if(cx>=px&&cx<=px+PILL_W&&cy>=PILL_CY-PILL_H/2-4&&cy<=PILL_CY+PILL_H/2+4){
      hit=true;
      if(p.id!==cbType){cbType=p.id;restart();}
    }
  });
  if(!hit) togglePlay();
});
</script>
